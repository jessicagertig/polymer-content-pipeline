# The content engine, run on GitHub Actions.
# Timers on the Lambda in lambdas/slack_handler (template.yaml) start it daily. 13:17 UTC:
# `python main.py run` writes and stages the next Launch Batch post, or this week's calendar post
# when one is due. 14:17 UTC: `python main.py index` submits pages the site changed in the last
# 24 hours for indexing. GitHub's own schedule never started a run in this repo, so none is set
# here. "Run workflow" starts either by hand.
# The Slack buttons start it too, through the Lambda in lambdas/slack_handler: Resume now with
# `resume <slug>`, and Redraft with `redraft <slug>` and the instructions typed into its box.
# Each run works on its own branch, engine-run/<command>-<UTC time>. lib/repo.stage commits and
# pushes every file the engine saves to that branch as it writes it, and the last step squash-merges
# the branch into main as one commit, so the next run reads the updated calendar and resumes a
# stopped post. If that merge conflicts, the files stay on the branch and Slack gets a notice.

name: Content engine

on:
  workflow_dispatch:
    inputs:
      command:
        description: "main.py command"
        type: choice
        default: run
        options: [run, index, doctor, redraft, resume]
      slug:
        description: "Post slug, for redraft and resume"
        type: string
        default: ""
      instructions:
        description: "Redraft instructions"
        type: string
        default: ""

concurrency:
  group: content-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Start the run's branch
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          branch="engine-run/${{ inputs.command }}-$(date -u +%Y-%m-%d-%H%M)"
          echo "RUN_BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"
          git push -q -u origin "$branch"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_STUDIO_URL: ${{ secrets.SANITY_STUDIO_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          GOOGLE_INTERNAL_SHEETS_CLIENT_ID: ${{ secrets.GOOGLE_INTERNAL_SHEETS_CLIENT_ID }}
          GOOGLE_INTERNAL_SHEETS_CLIENT_SECRET: ${{ secrets.GOOGLE_INTERNAL_SHEETS_CLIENT_SECRET }}
          GOOGLE_INTERNAL_SHEETS_REFRESH_TOKEN: ${{ secrets.GOOGLE_INTERNAL_SHEETS_REFRESH_TOKEN }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SLUG: ${{ inputs.slug }}
          REDRAFT_INSTRUCTIONS: ${{ inputs.instructions }}
        run: python main.py ${{ inputs.command }} "$SLUG"

      - name: Commit the outputs and the calendar
        if: always() && env.RUN_BRANCH != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
        run: |
          git add -A
          git diff --cached --quiet || git commit -q -m "Engine run: ${{ inputs.command }}"
          git push -q origin "$RUN_BRANCH"
          git fetch -q origin main
          git checkout -q -B main origin/main
          if git merge --squash "$RUN_BRANCH"; then
            git diff --cached --quiet || git commit -q -m "Engine run: ${{ inputs.command }} ($RUN_BRANCH)"
            git push -q origin main
          else
            git reset -q --merge
            python -c "from connectors.slack import notify_merge_failed; notify_merge_failed('$RUN_BRANCH')"
            exit 1
          fi
