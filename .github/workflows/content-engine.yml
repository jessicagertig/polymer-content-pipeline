# The content engine, run on GitHub Actions.
# 13:00 UTC daily: `python main.py run` writes and stages the next Launch Batch post, or this
# week's calendar post when one is due. 14:00 UTC daily: `python main.py index` submits pages
# the site changed in the last 24 hours for indexing. "Run workflow" starts either by hand.
# After each run, the post's output folder and the calendar are committed to this repo, so the
# next run reads the updated calendar and resumes a stopped post.

name: Content engine

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "main.py command"
        type: choice
        default: run
        options: [run, index, doctor]

concurrency:
  group: content-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_STUDIO_URL: ${{ secrets.SANITY_STUDIO_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CONTENT_CHANNEL: ${{ secrets.SLACK_CONTENT_CHANNEL }}
          SLACK_REPORT_CHANNEL: ${{ secrets.SLACK_REPORT_CHANNEL }}
          GOOGLE_INTERNAL_SHEETS_CLIENT_ID: ${{ secrets.GOOGLE_INTERNAL_SHEETS_CLIENT_ID }}
          GOOGLE_INTERNAL_SHEETS_CLIENT_SECRET: ${{ secrets.GOOGLE_INTERNAL_SHEETS_CLIENT_SECRET }}
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python main.py ${{ inputs.command || (github.event.schedule == '0 14 * * *' && 'index') || 'run' }}

      - name: Commit the outputs and the calendar
        if: always()
        run: |
          git config user.name "content-engine"
          git config user.email "content-engine@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Engine run: ${{ inputs.command || 'scheduled' }}"
          git push
