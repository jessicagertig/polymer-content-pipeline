version = 0.1

[default.deploy.parameters]
stack_name = "polymer-blog-bot"
resolve_s3 = true
s3_prefix = "polymer-blog-bot"
region = "us-east-1"
profile = "polymer"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
# Secrets are passed via `make deploy` (sources .env). Do not put them here.
image_repositories = []

[default.global.parameters]
region = "us-east-1"
