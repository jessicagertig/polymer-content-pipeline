AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Polymer content engine - Slack integration (button clicks) and the daily run timers

Parameters:
  SlackBotToken:
    Type: String
    NoEcho: true
    Description: Slack bot token (xoxb-...)
  SlackSigningSecret:
    Type: String
    NoEcho: true
    Description: Slack signing secret for request verification
  SlackChannelId:
    Type: String
    Description: Slack channel ID for the redraft confirmation
  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub PAT with repo scope for workflow_dispatch
  GitHubOwner:
    Type: String
    Default: jessicagertig
  GitHubRepo:
    Type: String
    Default: polymer-content-pipeline

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:

  SlackApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod

  SlackHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: polymer-content-engine-slack-handler
      Handler: handler.lambda_handler
      CodeUri: lambdas/slack_handler/
      Environment:
        Variables:
          SLACK_BOT_TOKEN: !Ref SlackBotToken
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          GITHUB_TOKEN: !Ref GitHubToken
          GITHUB_OWNER: !Ref GitHubOwner
          GITHUB_REPO: !Ref GitHubRepo
      Events:
        SlackInteract:
          Type: Api
          Properties:
            RestApiId: !Ref SlackApi
            Path: /slack/interact
            Method: POST
        DailyRun:
          Type: Schedule
          Properties:
            Schedule: cron(17 13 * * ? *)
            Input: '{"scheduled_command": "run"}'
        DailyIndex:
          Type: Schedule
          Properties:
            Schedule: cron(17 14 * * ? *)
            Input: '{"scheduled_command": "index"}'
        TestRun2045:   # one-time test of the timed run, 2026-11-05; remove after it runs
          Type: Schedule
          Properties:
            Schedule: cron(45 20 5 11 ? 2026)
            Input: '{"scheduled_command": "run"}'
        TestRun2245:   # one-time test of the timed run, 2026-11-05; remove after it runs
          Type: Schedule
          Properties:
            Schedule: cron(45 22 5 11 ? 2026)
            Input: '{"scheduled_command": "run"}'

Outputs:
  SlackInteractUrl:
    Description: Set this as the Slack Interactivity Request URL
    Value: !Sub "https://${SlackApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/slack/interact"
