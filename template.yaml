AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Polymer blog bot - scheduled blog post generation into Sanity drafts

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
  SanityDataset:
    Type: String
  SanityApiToken:
    Type: String
    NoEcho: true
    Description: Sanity token with write access to the dataset
  SanityStudioUrl:
    Type: String
    Default: ""
    Description: Studio base URL, for the draft link in Slack (optional)
  SlackBotToken:
    Type: String
    NoEcho: true
    Description: Slack bot token (xoxb-...)
  SlackContentChannel:
    Type: String
    Description: Slack channel for staged-draft messages and run reports
  GoogleInternalSheetsClientId:
    Type: String
    Description: OAuth client ID shared with inflow-ats and polymer-engagement-pipeline
  GoogleInternalSheetsClientSecret:
    Type: String
    NoEcho: true
  GoogleInternalSheetsRefreshToken:
    Type: String
    NoEcho: true
    Description: Refresh token granted the spreadsheets scope
  GoogleSearchConsoleRefreshToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Refresh token granted the webmasters scope; empty skips Google indexing requests
  GscSiteUrl:
    Type: String
    Default: "https://www.polymer.co/"
  IndexNowKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: IndexNow key, also hosted at https://www.polymer.co/<key>.txt
  GithubRepo:
    Type: String
    Description: owner/name of this repo; the function commits each run's output there
  GithubToken:
    Type: String
    NoEcho: true
    Description: Fine-grained PAT for that repo with Contents read and write
  RunSchedule:
    Type: String
    Default: "cron(0 13 ? * MON *)"
    Description: EventBridge Scheduler expression for the weekly staging run (UTC)
  IndexSchedule:
    Type: String
    Default: "cron(0 14 * * ? *)"
    Description: EventBridge Scheduler expression for the daily indexing run (UTC)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 900
    MemorySize: 512

Resources:

  BlogBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: polymer-blog-bot
      Handler: lambda_handler.lambda_handler
      CodeUri: .
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          SANITY_DATASET: !Ref SanityDataset
          SANITY_API_TOKEN: !Ref SanityApiToken
          SANITY_STUDIO_URL: !Ref SanityStudioUrl
          SLACK_BOT_TOKEN: !Ref SlackBotToken
          SLACK_CONTENT_CHANNEL: !Ref SlackContentChannel
          GOOGLE_INTERNAL_SHEETS_CLIENT_ID: !Ref GoogleInternalSheetsClientId
          GOOGLE_INTERNAL_SHEETS_CLIENT_SECRET: !Ref GoogleInternalSheetsClientSecret
          GOOGLE_INTERNAL_SHEETS_REFRESH_TOKEN: !Ref GoogleInternalSheetsRefreshToken
          GOOGLE_SEARCH_CONSOLE_REFRESH_TOKEN: !Ref GoogleSearchConsoleRefreshToken
          GSC_SITE_URL: !Ref GscSiteUrl
          INDEXNOW_KEY: !Ref IndexNowKey
          GITHUB_REPO: !Ref GithubRepo
          GITHUB_TOKEN: !Ref GithubToken
      Events:
        WeeklyRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref RunSchedule
            Input: '{"command": "run"}'
        DailyIndex:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref IndexSchedule
            Input: '{"command": "index"}'

Outputs:
  FunctionName:
    Value: !Ref BlogBotFunction
